[package]
name = "tftio-lib"
version = "0.4.4"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Shared CLI and agent-mode plumbing library for tftio Rust tools"
readme = "README.md"
repository = "https://github.com/tftio/tftio-lib"
homepage = "https://github.com/tftio/tftio-lib"
keywords = ["cli", "agent", "clap", "tooling"]
categories = ["command-line-utilities", "development-tools"]
# Not published to crates.io while the GitHub repository is the distribution
# channel. Revisit before re-enabling.
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
enum_glob_use = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[lib]
name = "tftio_lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
clap_complete = "4.6.11"
colored = "3.1.1"
indicatif = "0.18.6"
is-terminal = "0.4.17"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
